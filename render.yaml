# Render (https://render.com) runs this server from this file: New > Blueprint, pick this repo. Free plan: it sleeps after 15
# minutes without anyone connected and takes about a minute to wake up for the first one.
services:
  - type: web
    name: pokesquad-showdown
    runtime: node
    plan: free
    buildCommand: npm install --omit=optional --no-audit --no-fund && node build
    startCommand: node pokemon-showdown start --skip-build
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # the database (a free Postgres, such as Neon: server/pokesquad-db.ts): its connection string is set by hand in Render's
      # Environment settings, never in this file; sync: false keeps a Blueprint sync from ever changing or clearing it
      - key: DATABASE_URL
        sync: false
      # the administrators: their names, comma-separated; each gets the rank once logged in with its password
      - key: POKESQUAD_ADMINS
        value: admin
